<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login de Usuario</title>
    <style>
        /* Estilos para centrar y mejorar la apariencia del formulario */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #loginForm {
            display: flex;
            flex-direction: column;
            width: 300px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            margin-top: 10px;
            color: #555;
        }

        input[type="text"],
        input[type="password"] {
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #45a049;
        }

        #loginMessage {
            text-align: center;
            margin-top: 10px;
            color: red;
            font-size: 14px;
        }

        /* Botón de registro */
        .register-button {
            background-color: #008CBA;
            margin-top: 10px;
            text-align: center;
            display: block;
            padding: 10px;
            border-radius: 4px;
            color: white;
            text-decoration: none;
        }

        .register-button:hover {
            background-color: #007bb5;
        }
    </style>
</head>
<body>
    <div>
        <h1>Login de Usuario</h1>
        <form id="loginForm">
            <label for="nombreUsuario">Nombre de Usuario:</label>
            <input type="text" id="nombreUsuario" required>

            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" required>

            

            <button type="submit">Ingresar</button>
        </form>

        <p id="loginMessage"></p>

        <!-- Botón para redirigir a la página de registro -->
        <a href="registroUsuario.html" class="register-button">Registrar</a>
    </div>

    <script src="Usuario.js"></script>
</body>
</html>
